<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Benefits Scroll Section</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- jQuery -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<style>
.head-wire {
  background:#000;
  color:#fff;
}

/* ===== BENEFITS SECTION ===== */
#benefits-scroll-section {
  position: relative;
  height: 500vh; /* controls scroll length */
}

.benefits-sticky {
  position: sticky;
  top: 0;
  height: 100vh;
  display: flex;
  align-items: center;
}

/* LEFT IMAGES */
.benefits-image-wrap {
  position: relative;
  width: 100%;
  height: 600px;
}

.benefits-image {
  position: absolute;
  inset: 0;
  opacity: 0;

}

.benefits-image.active {
  opacity: 1;
  transform: scale(1);
}

/* RIGHT CONTENT */
.benefits-content-wrap {
  position: relative;
  height: 400px;
}

.benefits-content {
  position: absolute;
  opacity: 0;
  transform: translateY(30px);
  transition: opacity .6s ease, transform .6s ease;
}

.benefits-content.active {
  opacity: 1;
  transform: translateY(0);
}

/* TEXT STYLES */
.benefit-number {
  font-size: 72px;
  font-weight: 700;
  color: #cfff00;
}

.benefit-title {
  font-size: 42px;
  font-weight: 700;
}

.benefit-desc {
  max-width: 520px;
  font-size: 18px;
  opacity: .85;
}

</style>
</head>

<body>

<!-- ===== BENEFITS ===== -->
 <div class="heade-wire">
  <section id="benefits-scroll-section">
  <div class="container benefits-sticky">
    <div class="row w-100 align-items-center">

      <!-- LEFT -->
      <div class="col-lg-5">
        <div class="benefits-image-wrap">
          <img src="images/head1.png" class="img-fluid h-100 benefits-image active">
          <img src="images/head-2.png" class="img-fluid h-100 benefits-image">
          <img src="images/head-3.png" class="img-fluid h-100 benefits-image">
          <img src="images/head-4.png" class="img-fluid h-100 benefits-image">
          <img src="images/head-5.png" class="img-fluid h-100 benefits-image">
        </div>
      </div>

      <!-- RIGHT -->
      <div class="col-lg-7">
        <div class="benefits-content-wrap d-flex align-items-center justify-content-center">

          <div class="benefits-content active">
            <h2 class="display-1 fw-bold">Our Core Benefits</h2>
          </div>

          <div class="benefits-content">
            <div class="benefit-number">01</div>
            <h2 class="benefit-title">Rapid Execution</h2>
            <p class="benefit-desc">Automated systems deliver outcomes 10× faster.</p>
          </div>

          <div class="benefits-content">
            <div class="benefit-number">02</div>
            <h2 class="benefit-title">Viral Branding</h2>
            <p class="benefit-desc">Gen Z storytelling designed for attention.</p>
          </div>

          <div class="benefits-content">
            <div class="benefit-number">03</div>
            <h2 class="benefit-title">Smart Automation</h2>
            <p class="benefit-desc">AI agents working 24/7 without friction.</p>
          </div>

          <div class="benefits-content">
            <div class="benefit-number">04</div>
            <h2 class="benefit-title">Future Proofing</h2>
            <p class="benefit-desc">Continuously evolving AI systems.</p>
          </div>

        </div>
      </div>

    </div>
  </div>
</section>
 </div>


<script>
$(window).on("scroll", function () {
  const section = $("#benefits-scroll-section");
  const scrollTop = $(window).scrollTop();
  const sectionTop = section.offset().top;
  const sectionHeight = section.height();
  const progress = (scrollTop - sectionTop) / sectionHeight;

  if (progress < 0 || progress > 1) return;

  const steps = $(".benefits-image").length;
  const index = Math.min(
    steps - 1,
    Math.floor(progress * steps)
  );

  $(".benefits-image, .benefits-content").removeClass("active");
  $(".benefits-image").eq(index).addClass("active");
  $(".benefits-content").eq(index).addClass("active");
});
</script>

</body>
</html>
