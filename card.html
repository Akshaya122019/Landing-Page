    <style>
        #squad {
  position: relative;
  height: 100vh;
  overflow: hidden;
  background: #f8f9fa;
}

.squad-track {
  display: flex;
  gap: 30px;
  position: absolute;
  top: 50%;
  left: 0;
  transform: translateY(-50%);
  will-change: transform;
}

.squad-card {
  min-width: 300px;
  background: #fff;
  border-radius: 16px;
  padding: 20px;
  text-align: center;
  box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
}

.squad-card img {
  width: 120px;
  height: 120px;
  border-radius: 50%;
  object-fit: cover;
}

.section-paddings {
  padding: 100px 0;
}
    </style>
</head>

<body>

    <script>
        gsap.registerPlugin(ScrollTrigger);

const card = $("#card");

// Create the master timeline
const tl = gsap.timeline({
  scrollTrigger: {
    trigger: "#scroll-container",
    start: "top top",
    end: "+=3500", // Total scroll distance
    scrub: 1,
    pin: true,
    anticipatePin: 1
  }
});
