<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Scroll Sequence (jQuery)</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
/* WRAPPER */
.aiSeq-wrapper {
  background: #000;
  color: #fff;
  font-family: sans-serif;
}

/* SCROLL AREA (TALL FOR SCROLLING) */
#aiSeq-scroll {
  height: 3500px;
  background-color: #0a0a0a;
  background-image: radial-gradient(circle at 2px 2px, #1a1a1a 2px, transparent 0);
  background-size: 40px 40px;
}

/* STICKY CENTER */
.aiSeq-sticky {
  position: sticky;
  top: 0;
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* CARD */
.aiSeq-card {
  background: #111;
  width: 90%;
  max-width: 650px;
  height: 400px;
  border-radius: 8px;
  border: 1px solid #1a1a1a;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: box-shadow 0.8s ease, border-color 0.8s ease;
}

/* STEPS */
.aiSeq-step {
  position: absolute;
  text-align: center;
  width: 100%;
  padding: 20px;
  opacity: 0;
  transform: translateY(20px);
  transition: opacity 0.6s ease, transform 0.6s ease;
}

.aiSeq-step.active {
  opacity: 1;
  transform: translateY(0);
}

.aiSeq-step h2 {
  font-size: 3rem;
  margin-bottom: 15px;
}

.aiSeq-step p {
  color: #aaa;
  max-width: 450px;
  margin: auto;
}

/* STATES */
.aiSeq-state-empty { box-shadow: none; }
.aiSeq-state-1 {
  box-shadow: -50px 0 100px -20px rgba(255,255,255,.3),
               50px 0 100px -20px rgba(172,255,47,.6);
}
.aiSeq-state-2 {
  box-shadow: 0 0 80px -10px rgba(172,255,47,.6);
}
.aiSeq-state-3 {
  box-shadow: 50px 0 100px -20px rgba(255,255,255,.3),
              -50px 0 100px -20px rgba(172,255,47,.6);
}
</style>
</head>

<body>

<section class="aiSeq-wrapper">
  <section id="aiSeq-scroll">

    <div class="aiSeq-sticky">
      <div class="aiSeq-card aiSeq-state-empty" id="aiSeq-card">

        <div class="aiSeq-step" id="aiSeq-step-1">
          <h2>Connect</h2>
          <p>We decode your brand, audience and goals.</p>
        </div>

        <div class="aiSeq-step" id="aiSeq-step-2">
          <h2>Create</h2>
          <p>We turn strategy into visuals and automations.</p>
        </div>

        <div class="aiSeq-step" id="aiSeq-step-3">
          <h2>Chat</h2>
          <p>We collaborate in real time to shape ideas.</p>
        </div>

      </div>
    </div>

  </section>
</section>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<script>
$(window).on("scroll", function () {

  const scrollTop = $(window).scrollTop();
  const sectionTop = $("#aiSeq-scroll").offset().top;
  const sectionHeight = $("#aiSeq-scroll").outerHeight();
  const progress = (scrollTop - sectionTop) / sectionHeight;

  $(".aiSeq-step").removeClass("active");
  $("#aiSeq-card").removeClass("aiSeq-state-empty aiSeq-state-1 aiSeq-state-2 aiSeq-state-3");

  if (progress < 0.25) {
    $("#aiSeq-card").addClass("aiSeq-state-1");
    $("#aiSeq-step-1").addClass("active");
  }
  else if (progress < 0.55) {
    $("#aiSeq-card").addClass("aiSeq-state-2");
    $("#aiSeq-step-2").addClass("active");
  }
  else if (progress < 0.85) {
    $("#aiSeq-card").addClass("aiSeq-state-3");
    $("#aiSeq-step-3").addClass("active");
  }

});
</script>

</body>
</html>
